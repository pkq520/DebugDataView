name: .NET

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    - name: setup-msbuild
      uses: microsoft/setup-msbuild@v1.1.3
#   - name: Setup dotnet
#     uses: actions/setup-dotnet@v3
#     with:
#       global-json-file: global.json
    - name: Restore dependencies
      run: msbuild /t:restore DebugDataView.slnx
    - name: Build
      run: msbuild /t:build DebugDataView.slnx